
name: Selenium Java Cucumber Automation

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Execute Selenium Cucumber Tests
        run: mvn clean test
